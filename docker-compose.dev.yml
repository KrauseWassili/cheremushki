# Lokale Entwicklung mit Hot Reload für Frontend und Backend sowie
# Dev-Annehmlichkeiten (Postgres-Port nach außen, Mailcatcher), zusätzlich zur
# Basis-Konfiguration. Aufruf:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    # runserver mit Hot Reload statt des Produktions-Starts (daphne).
    command: bash ./scripts/run_backend_local.sh
    # !override statt Ergänzung: Compose hängt Port-Listen sonst an die der
    # Basisdatei an. Lokal immer nur 127.0.0.1, unabhängig von PUBLISH_IP.
    ports: !override
      - "127.0.0.1:8010:8000"
    volumes:
      # Live-Code + Hot Reload für lokale Entwicklung. Compose führt
      # Volume-Listen über den Container-Pfad zusammen: Ohne den Eintrag für
      # /src/media würde das benannte media-Volume aus docker-compose.yml das
      # Host-Verzeichnis backend/media überdecken.
      - ./backend:/src
      - static:/src/staticfiles
      - ./backend/media:/src/media

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/frontend
      # node_modules/.next kommen aus dem Image, nicht vom Host – sonst
      # überschreibt der Bind-Mount sie mit dem (leeren) lokalen Stand.
      # Nach Änderungen an frontend/package.json:
      #   docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
      # (verwirft das anonyme node_modules-Volume) und danach `up --build`,
      # sonst bleibt der alte node_modules-Stand über Rebuilds hinweg bestehen.
      - /frontend/node_modules
      - /frontend/.next
    ports: !override
      - "127.0.0.1:3000:3000"

  worker:
    volumes:
      - ./backend:/src
      # Gleicher Pfad wie beim backend, siehe Kommentar dort; :ro wie
      # in docker-compose.yml.
      - ./backend/media:/src/media:ro

  celery_flower:
    volumes:
      - ./backend:/src

  celery_beat:
    volumes:
      - ./backend:/src

  mailcatcher:
    image: sj26/mailcatcher
    container_name: mailcatcher
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP-Port
      - "127.0.0.1:1080:1080"  # Webinterface
