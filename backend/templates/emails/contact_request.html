<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запрос на контакт</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; max-width:600px; width:100%;">
          <tr>
            <td style="background-color:#1c1c1e; padding:24px 32px;">
              <span style="color:#ffffff; font-size:20px; font-weight:bold;">Запрос на контакт</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px; font-size:16px; line-height:1.5; color:#1c1c1e;">
                Здравствуй, {{ to_user.first_name }}!
              </p>
              <p style="margin:0 0 16px; font-size:16px; line-height:1.5; color:#1c1c1e;">
                <strong>{{ from_user.full_name }}</strong> ({{ from_user.email }}) хочет связаться с тобой.
              </p>
              {% if message %}
              <p style="margin:0 0 8px; font-size:14px; line-height:1.5; color:#6b6b70;">Сообщение:</p>
              <blockquote style="margin:0 0 16px; padding:12px 16px; border-left:3px solid #e5e5ea; font-size:16px; line-height:1.5; color:#1c1c1e; white-space:pre-line;">{{ message }}</blockquote>
              {% endif %}
              <p style="margin:0; font-size:14px; line-height:1.5; color:#6b6b70;">
                Чтобы ответить, просто ответь на это письмо – ответ придёт напрямую на <a href="mailto:{{ from_user.email }}" style="color:#2AABEE;">{{ from_user.email }}</a>.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
