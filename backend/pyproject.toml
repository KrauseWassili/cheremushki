[project]
name = "backend"
version = "0.1.0"
description = "API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adrf>=0.1.13",
    "celery>=5.6.2",
    "daphne>=4.2.2",
    "django>=6.0.2",
    "django-cors-headers>=4.9.0",
    "django-csp>=4.0",
    "django-environ>=0.12.0",
    "django-extensions>=4.1",
    "django-filter>=25.2",
    "django-taggit>=6.1.0",
    "django-unfold>=0.78.1",
    "djangorestframework>=3.18.2",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-routers>=0.95.0",
    "drf-spectacular>=0.29.0",
    "flower>=2.0.1",
    "markdown>=3.10.1",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.11",
    "redis>=5.0.0",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

# Nur Entwicklung/CI (uv sync installiert die Gruppe per Default mit), nicht
# im Image: Der Dockerfile ruft uv sync --no-dev.
[dependency-groups]
dev = [
    "black>=26.5.1",
]
