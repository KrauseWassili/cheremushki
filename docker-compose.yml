name: Cheremushki

services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres-db:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  backend:
    depends_on:
      db:
        condition: service_healthy
      # Nicht optional: Die Rate-Limits zählen im Django-Cache, und DRFs
      # Throttle fängt einen Cache-Fehler nicht ab – ohne Redis antwortet
      # /accounts/login/ mit 500 statt zu drosseln.
      redis:
        condition: service_healthy
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - staticfiles:/src/staticfiles
    expose:
      - "8000"
    # Remove for production deployment, only for local development
    ports:
      # 8010, nicht 8000: Der Host läuft parallel stock_scanner_app, dessen
      # eigener Backend-Container bereits 8000:8000 belegt.
      - "8010:8000"
    container_name: backend
    env_file: .env
    command: bash ./scripts/run_backend_local.sh
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_*-Variablen werden von Next.js zur Build-Zeit in das
      # Bundle eingebrannt, nicht zur Laufzeit gelesen – env_file allein
      # reicht hier nicht, sie müssen als Build-Arg durchgereicht werden.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    ports:
      - "3000:3000"
    container_name: frontend
    env_file: .env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # Keine environment-Overrides für Redis/Celery: settings.py liest
    # DJANGO_CELERY_BROKER_URL und DJANGO_CELERY_RESULT_BACKEND – Keys ohne
    # dieses Prefix sind wirkungslos und täuschen eine Konfiguration vor.
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config.celery:app worker -Q generation,default -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_flower:
    depends_on:
      - db
      - redis
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config.celery:app flower --port=5555
    env_file:
      - .env
    ports:
      # 5556, nicht 5555: stock_scanner_app hat einen eigenen (aktuell
      # inaktiven) celery_flower-Dienst auf 5555 – Kollision vorbeugen.
      - "5556:5555"
    restart: unless-stopped

  celery_beat:
    depends_on:
      - db
      - redis
      - worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A config.celery:app beat -l info
    restart: unless-stopped

volumes:
  postgres-db:
  staticfiles: