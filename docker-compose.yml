name: Cheremushki

services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres-db:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  backend:
    depends_on:
      db:
        condition: service_healthy
      # Nicht optional: Die Rate-Limits zählen im Django-Cache, und DRFs
      # Throttle fängt einen Cache-Fehler nicht ab – ohne Redis antwortet
      # /accounts/login/ mit 500 statt zu drosseln.
      redis:
        condition: service_healthy
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      # Remove for production deployment, only for local development (live code + hot reload)
      # Media liegt unter ./backend/media (über ./backend:/src), kein separates Volume —
      # sonst landen Uploads unsichtbar im Docker-Volume statt auf dem Host.
      - ./backend:/src
      - staticfiles:/src/staticfiles
    expose:
      - "8000"
    # Remove for production deployment, only for local development
    ports:
      - "8000:8000"
    container_name: backend
    env_file: .env
    command: bash ./scripts/run_backend_local.sh
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # Keine environment-Overrides für Redis/Celery: settings.py liest
    # DJANGO_CELERY_BROKER_URL und DJANGO_CELERY_RESULT_BACKEND – Keys ohne
    # dieses Prefix sind wirkungslos und täuschen eine Konfiguration vor.
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config.celery:app worker -Q generation,default -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/src

  celery_flower:
    depends_on:
      - db
      - redis
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config.celery:app flower --port=5555
    env_file:
    - .env
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/src
    restart: unless-stopped

  celery_beat:
    depends_on:
      - db
      - redis
      - worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A config.celery:app beat -l info
    volumes:
      - ./backend:/src
    restart: unless-stopped

  mailcatcher:
    image: sj26/mailcatcher
    container_name: mailcatcher
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP-Port
      - "1080:1080"  # Webinterface

volumes:
  postgres-db:
  staticfiles: