name: Cheremushki

services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres-db:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  backend:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - media:/src/media
      - staticfiles:/src/staticfiles
    expose:
      - "8000"
    # Remove for production deployment, only for local development
    ports:
      - "8000:8000"
    container_name: backend
    env_file: .env
    command: bash ./scripts/run_backend_local.sh
    restart: unless-stopped

volumes:
  postgres-db:
  media:
  staticfiles: